---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://www.ammitto.org/schemas/us-announcement.yml
title: US OFAC Sanction Announcement
description: Schema for US OFAC sanction announcements (SDN list updates)
type: object
required:
  - id
  - announcement
  - sanction_details
properties:
  id:
    type: string
    description: Unique identifier for this announcement
    pattern: "^us/[a-z0-9-]+$"

  announcement:
    type: object
    required:
      - title
      - publish_date
    properties:
      title:
        type: string
        description: Title of the announcement
      url:
        type: string
        format: uri
        description: URL to official source (Federal Register)
      publish_date:
        type: string
        format: date
        description: Publication date (YYYY-MM-DD)
      publish_time:
        type: string
        pattern: "^[0-2][0-9]:[0-5][0-9]$"
        description: Publication time (HH:MM)
      document_id:
        type: string
        description: Federal Register document ID
      document_type:
        type: string
        description: Type of document (links to document-types.yml)
      authority:
        type: string
        description: Issuing authority (links to organizations.yml)
      publisher:
        type: string
        description: Publisher (links to organizations.yml)
      lang:
        type: string
        pattern: "^[a-z]{2,3}(-[A-Za-z]{4})?(-[A-Z]{2})?$"
        description: Language code
        default: en
      content:
        type: string
        description: Full announcement text

  sanction_details:
    type: array
    items:
      type: object
      required:
        - entity
        - measures
      properties:
        entity:
          type: object
          required:
            - type
            - name
          properties:
            type:
              type: string
              enum: [person, organization, vessel, aircraft]
            uid:
              type: string
              description: OFAC unique ID
            name:
              type: object
              properties:
                full_name:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                script:
                  type: string
                  description: ISO 15924 script code
            aliases:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                    enum: [aka, fka]
                  category:
                    type: string
                    enum: [strong, weak]
            identifiers:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  number:
                    type: string
                  issuing_country:
                    type: string
            addresses:
              type: array
              items:
                type: object
                properties:
                  street:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  country:
                    type: string
                  country_code:
                    type: string
                  postal_code:
                    type: string
            birth_info:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  year:
                    type: string
                  place:
                    type: string
                  country:
                    type: string
            nationalities:
              type: array
              items:
                type: string
            citizenships:
              type: array
              items:
                type: string
            remarks:
              type: string

        measures:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - asset_freeze
                  - trade_restriction
                  - arms_embargo
                  - financial_sanction
                  - sectoral_sanction
                  - other
              description:
                type: object
                description: Localized description
        programs:
          type: array
          description: OFAC program codes
          items:
            type: string
        reasons:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              description:
                type: object
        period:
          type: object
          properties:
            effective_date:
              type: string
              format: date
            expiry_date:
              type: string
              format: date
            is_indefinite:
              type: boolean

  legal_citations:
    type: array
    description: Legal instruments cited as basis (Executive Orders, statutes)
    items:
      type: object
      properties:
        legal_instrument_id:
          type: string
          description: Reference to legal instrument
        citation_type:
          type: string
          enum: [legal_basis, reference, amendment]

  group_id:
    type: string
    description: ID for grouping multiple entries from same designation
